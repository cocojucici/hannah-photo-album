<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hannah's Photo album</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#242920;font-family:Arial,'PingFang SC',sans-serif}header{padding:28px 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #deded5}.brand{font-size:23px;letter-spacing:0px}.brand small{font-size:10px;letter-spacing:2px;margin-left:18px;color:#777}button,label{cursor:pointer}button,.upload{border:1px solid #d4d7cc;background:transparent;border-radius:30px;padding:10px 19px;color:inherit}main{padding:36px 4vw}h1{font-size:36px;font-weight:500;margin:0 0 12px;letter-spacing:2px}.intro{color:#7d8278;font-size:13px;margin-bottom:32px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.bar span{font-size:12px;color:#85897e}.active{background:#303e2d;color:white;border-color:#303e2d}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}.photo{display:block;width:100%;padding:0;border:0;border-radius:3px;overflow:hidden;margin:0 0 14px;position:relative;background:#e0e1d8;break-inside:avoid}.photo img{width:100%;display:block;transition:transform .5s}.photo:hover img{transform:scale(1.04)}.caption{position:absolute;bottom:0;left:0;right:0;padding:36px 15px 15px;background:linear-gradient(transparent,#0008);color:white;text-align:left;opacity:0;transition:.2s}.photo:hover .caption,.photo:focus .caption{opacity:1}footer{text-align:center;font-size:11px;letter-spacing:3px;color:#909587;padding:30px}dialog{background:#151714;color:white;border:0;max-width:96vw;width:96vw;height:94vh;padding:45px}dialog::backdrop{background:#000d}dialog img{height:calc(100% - 45px);width:100%;object-fit:contain}dialog .close{position:absolute;right:15px;top:10px}dialog nav{display:flex;align-items:center;justify-content:center;gap:24px}.notice{font-size:12px;color:#878b80}button:focus-visible,label:focus-within{outline:3px solid #95a780;outline-offset:3px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{margin-bottom:9px}header{padding:20px 5vw}.brand small{display:none}.brand{font-size:18px;max-width:65%}main{padding:28px 4vw}h1{font-size:28px}.upload{font-size:12px}dialog{padding:45px 8px}}.grid{display:block;position:relative}.grid .photo{position:absolute;margin:0;top:0;left:0}.photo img{height:auto}</style><header><div class="brand">Hannah's Photo album<span style="color:#8a957a"> ◦</span><small>A PHOTO JOURNAL</small></div><label class="upload">＋ 添加照片<input id="files" type="file" accept="image/*" multiple hidden></label></header><main><div class="grid" id="grid"></div></main><footer>Hannah's Photo album &nbsp; / &nbsp; EVERY MOMENT MATTERS</footer><dialog id="viewer"><button class="close" aria-label="关闭">✕</button><img id="large" alt=""><nav><button id="prev" aria-label="上一张">←</button><span id="position"></span><button id="next" aria-label="下一张">→</button></nav></dialog><script>let photos=[{"src": "1.JPG", "name": "1.JPG", "width": 1280, "height": 1707}, {"src": "2.JPG", "name": "2.JPG", "width": 1280, "height": 3413}, {"src": "3.JPG", "name": "3.JPG", "width": 1280, "height": 5120}, {"src": "4.JPG", "name": "4.JPG", "width": 1440, "height": 960}, {"src": "5.JPG", "name": "5.JPG", "width": 1620, "height": 1080}, {"src": "6.JPG", "name": "6.JPG", "width": 1080, "height": 1621}, {"src": "7.JPG", "name": "7.JPG", "width": 1080, "height": 1620}, {"src": "8.JPG", "name": "8.JPG", "width": 1280, "height": 1920}, {"src": "9.JPG", "name": "9.JPG", "width": 1280, "height": 1706}, {"src": "10.JPG", "name": "10.JPG", "width": 1280, "height": 1920}, {"src": "11.JPG", "name": "11.JPG", "width": 1280, "height": 1707}, {"src": "12.JPG", "name": "12.JPG", "width": 1080, "height": 1440}, {"src": "13.JPG", "name": "13.JPG", "width": 1080, "height": 1620}, {"src": "14.JPG", "name": "14.JPG", "width": 1620, "height": 1080}, {"src": "15.JPG", "name": "15.JPG", "width": 1080, "height": 1441}, {"src": "16.JPG", "name": "16.JPG", "width": 1080, "height": 1440}, {"src": "17.JPG", "name": "17.JPG", "width": 1080, "height": 1440}, {"src": "18.JPG", "name": "18.JPG", "width": 1080, "height": 1440}, {"src": "19.JPG", "name": "19.JPG", "width": 1080, "height": 2880}, {"src": "20.JPG", "name": "20.JPG", "width": 1080, "height": 1620}, {"src": "21.JPG", "name": "21.JPG", "width": 1080, "height": 3240}, {"src": "22.JPG", "name": "22.JPG", "width": 1082, "height": 1442}, {"src": "23.JPG", "name": "23.JPG", "width": 1620, "height": 1080}];let current=0;const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');function render(){grid.replaceChildren();photos.forEach((p,i)=>{let b=document.createElement('button');b.className='photo';b.setAttribute('aria-label','查看 '+p.name);let img=new Image();img.width=p.width||900;img.height=p.height||900;img.onload=()=>{p.width=img.naturalWidth;p.height=img.naturalHeight;layout()};img.src=p.src;img.alt=p.name;img.loading=i<4?'eager':'lazy';let c=document.createElement('span');c.className='caption';c.textContent=p.name;b.append(img,c);b.onclick=()=>{current=i;show();viewer.showModal()};grid.append(b)});layout()}function layout(){const n=innerWidth<=600?2:innerWidth<=900?3:4,gap=innerWidth<=600?9:14,w=(grid.clientWidth-gap*(n-1))/n,heights=Array(n).fill(0);[...grid.children].forEach((b,i)=>{const col=heights.indexOf(Math.min(...heights)),p=photos[i],h=w*(p.height||900)/(p.width||900);b.style.width=w+'px';b.style.transform=`translate(${col*(w+gap)}px,${heights[col]}px)`;heights[col]+=h+gap});grid.style.height=Math.max(0,Math.max(...heights)-gap)+'px'}new ResizeObserver(layout).observe(grid);function show(){document.querySelector('#large').src=photos[current].src;document.querySelector('#large').alt=photos[current].name;document.querySelector('#position').textContent=`${current+1} / ${photos.length}`}function step(n){current=(current+n+photos.length)%photos.length;show()}document.querySelector('.close').onclick=()=>viewer.close();document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(viewer.open){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});document.querySelector('#files').onchange=e=>{const additions=[...e.target.files].filter(f=>f.type.startsWith('image/')).map(f=>({src:URL.createObjectURL(f),name:f.name}));photos.unshift(...additions);render()};render();</script></html>
